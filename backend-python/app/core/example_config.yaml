# SigmaSpend Bank Statement Mapping Configurations

# Set the active bank configuration to use during an upload session
active_bank: "starling"

banks:
  starling:
    name: "Starling Bank"
    account_id: "starling_1234"      # Unique handle for this specific card
    # The actual column names in Starling's CSV export
    mappings:
      date_column: "Counterparty Date"
      amount_column: "Amount (GBP)"
      description_column: "Counterparty"
    # Python datetime string format used to parse their dates safely
    date_format: "%d/%m/%Y"

